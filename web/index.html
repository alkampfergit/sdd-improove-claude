<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      #root {
        width: 100%;
        max-width: 500px;
      }

      .container {
        background: white;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 40px;
      }

      h1 {
        color: #333;
        margin-bottom: 30px;
        text-align: center;
        font-size: 28px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        transition: border-color 0.2s;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      button {
        width: 100%;
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: #5568d3;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .error {
        color: #e74c3c;
        font-size: 14px;
        margin-top: 8px;
      }

      .success {
        background: #f0f9ff;
        border: 1px solid #bfe3ff;
        border-radius: 4px;
        padding: 16px;
        margin-top: 20px;
        color: #0369a1;
      }

      .short-code {
        font-family: 'Courier New', monospace;
        font-weight: bold;
        color: #667eea;
        word-break: break-all;
      }

      .copy-btn {
        display: inline-block;
        padding: 8px 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        margin-top: 8px;
      }

      .copy-btn:hover {
        background: #5568d3;
      }

      .links-section {
        margin-top: 40px;
        padding-top: 40px;
        border-top: 1px solid #eee;
      }

      .links-section h2 {
        color: #333;
        font-size: 20px;
        margin-bottom: 20px;
      }

      .links-list {
        list-style: none;
      }

      .link-item {
        background: #f9f9f9;
        border-left: 4px solid #667eea;
        padding: 16px;
        margin-bottom: 12px;
        border-radius: 4px;
      }

      .link-code {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .link-code-text {
        font-family: 'Courier New', monospace;
        font-weight: bold;
        color: #667eea;
      }

      .link-url {
        color: #666;
        font-size: 14px;
        word-break: break-all;
      }

      .empty-message {
        text-align: center;
        color: #999;
        padding: 20px;
        font-size: 14px;
      }

      .loading {
        text-align: center;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
